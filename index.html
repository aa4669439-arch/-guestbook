<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>留言板 · Guestbook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;700&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #f4ead5;
    --paper-dark: #e8d9b8;
    --ink: #3a2e21;
    --ink-soft: #6b5d4a;
    --accent: #b6452c;
    --line: #c9b896;
    --shadow: rgba(58, 46, 33, 0.18);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Noto Serif TC', serif;
    background:
      radial-gradient(circle at 20% 10%, #f8f0dd, transparent 60%),
      radial-gradient(circle at 80% 90%, #ede0c4, transparent 55%),
      var(--paper);
    color: var(--ink);
    min-height: 100vh;
    padding: 48px 20px;
    line-height: 1.7;
  }

  /* 紙張紋理 */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    pointer-events: none;
    opacity: 0.4;
    background-image:
      repeating-linear-gradient(0deg, transparent, transparent 31px, var(--line) 31px, var(--line) 32px);
    mask-image: linear-gradient(transparent 0, black 120px);
  }

  .wrap {
    max-width: 620px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    text-align: center;
    margin-bottom: 40px;
  }

  header .sub {
    font-family: 'Caveat', cursive;
    font-size: 1.7rem;
    color: var(--accent);
    transform: rotate(-2deg);
    display: inline-block;
  }

  h1 {
    font-size: 2.6rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin: 4px 0 8px;
  }

  h1::after {
    content: '';
    display: block;
    width: 70px;
    height: 3px;
    background: var(--accent);
    margin: 14px auto 0;
    border-radius: 2px;
  }

  /* 表單卡片 */
  .card {
    background: var(--paper-dark);
    border: 1px solid var(--line);
    border-radius: 4px;
    padding: 26px 24px;
    box-shadow: 4px 6px 0 var(--shadow);
    margin-bottom: 38px;
  }

  label {
    display: block;
    font-size: 0.85rem;
    font-weight: 600;
    color: var(--ink-soft);
    margin-bottom: 6px;
    letter-spacing: 1px;
  }

  input, textarea {
    width: 100%;
    font-family: inherit;
    font-size: 1rem;
    color: var(--ink);
    background: #fbf5e6;
    border: 1px solid var(--line);
    border-radius: 3px;
    padding: 10px 12px;
    margin-bottom: 16px;
    resize: vertical;
    transition: border-color .2s, box-shadow .2s;
  }

  input:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(182, 69, 44, 0.12);
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    letter-spacing: 1px;
    color: #fbf5e6;
    background: var(--accent);
    border: none;
    border-radius: 3px;
    padding: 11px 28px;
    cursor: pointer;
    box-shadow: 2px 3px 0 rgba(120, 40, 22, 0.5);
    transition: transform .12s, box-shadow .12s;
  }

  button:hover { transform: translate(-1px, -1px); box-shadow: 3px 4px 0 rgba(120, 40, 22, 0.5); }
  button:active { transform: translate(1px, 1px); box-shadow: 1px 1px 0 rgba(120, 40, 22, 0.5); }
  button:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }

  #status {
    min-height: 22px;
    font-size: 0.9rem;
    margin-top: 10px;
    font-family: 'Caveat', cursive;
    font-size: 1.2rem;
  }
  #status.ok { color: #4a7c44; }
  #status.err { color: var(--accent); }

  /* 留言列表 */
  .messages { display: flex; flex-direction: column; gap: 18px; }

  .msg {
    background: #fbf5e6;
    border-left: 4px solid var(--accent);
    border-radius: 3px;
    padding: 16px 18px;
    box-shadow: 2px 3px 0 var(--shadow);
    animation: pop .35s ease both;
  }

  @keyframes pop {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg .meta {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 6px;
  }
  .msg .name { font-weight: 700; color: var(--accent); }
  .msg .time { font-size: 0.78rem; color: var(--ink-soft); }
  .msg .text { white-space: pre-wrap; word-break: break-word; }

  .empty {
    text-align: center;
    color: var(--ink-soft);
    font-family: 'Caveat', cursive;
    font-size: 1.4rem;
    padding: 30px 0;
  }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="sub">say hello ~</span>
      <h1>留 言 板</h1>
    </header>

    <div class="card">
      <label for="name">你的名字</label>
      <input id="name" maxlength="50" placeholder="匿名">

      <label for="text">想說的話</label>
      <textarea id="text" rows="3" maxlength="500" placeholder="留下幾句吧…"></textarea>

      <button id="submit" onclick="submit()">寫下留言</button>
      <div id="status"></div>
    </div>

    <div class="messages" id="list">
      <div class="empty">載入中…</div>
    </div>
  </div>

<script>
  // ↓↓↓ 換成你的 Apps Script 部署網址 ↓↓↓
  const API_URL = 'https://script.google.com/macros/s/AKfycbxD6kMNDL0-PhmiHt3K8TXa3ge9AeW6duUNaA9RerPFPNGnKS_04gb9q85UFHtddjHh/exec';

  const $ = id => document.getElementById(id);

  function setStatus(msg, ok) {
    const el = $('status');
    el.textContent = msg;
    el.className = ok ? 'ok' : 'err';
  }

  function fmtTime(iso) {
    const d = new Date(iso);
    return d.toLocaleString('zh-TW', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' });
  }

  function escape(s) {
    const div = document.createElement('div');
    div.textContent = s;
    return div.innerHTML;
  }

  function render(messages) {
    const list = $('list');
    if (!messages || messages.length === 0) {
      list.innerHTML = '<div class="empty">還沒有人留言，當第一個吧！</div>';
      return;
    }
    list.innerHTML = messages.map(m => `
      <div class="msg">
        <div class="meta">
          <span class="name">${escape(m.name)}</span>
          <span class="time">${fmtTime(m.time)}</span>
        </div>
        <div class="text">${escape(m.text)}</div>
      </div>
    `).join('');
  }

  async function load() {
    try {
      const res = await fetch(API_URL);
      const data = await res.json();
      if (data.success) render(data.messages);
      else setStatus('讀取失敗：' + data.error, false);
    } catch (e) {
      setStatus('連線失敗：' + e.message, false);
      $('list').innerHTML = '<div class="empty">載入失敗 :(</div>';
    }
  }

  async function submit() {
    const name = $('name').value.trim() || '匿名';
    const text = $('text').value.trim();
    if (!text) { setStatus('留言內容不能空白', false); return; }

    $('submit').disabled = true;
    setStatus('送出中…', true);

    try {
      const res = await fetch(API_URL, {
        method: 'POST',
        // 用 text/plain 避免觸發 CORS preflight
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ name, text })
      });
      const data = await res.json();
      if (data.success) {
        $('text').value = '';
        render(data.messages);
        setStatus('留言成功！', true);
      } else {
        setStatus('失敗：' + data.error, false);
      }
    } catch (e) {
      setStatus('連線失敗：' + e.message, false);
    } finally {
      $('submit').disabled = false;
    }
  }

  load();
</script>
</body>
</html>
